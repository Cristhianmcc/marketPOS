services:
  # Next.js Web Service
  - type: web
    name: market-pos
    env: node
    region: oregon
    plan: free
    # El esquema se actualiza al arrancar (scripts/cloud-migrate.cjs, solo aditivo).
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
    autoDeploy: true
